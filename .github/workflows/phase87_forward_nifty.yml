name: Phase 87 prospective NIFTY futures capture

on:
  schedule:
    - cron: "0 11 * * 1-5"
  push:
    paths:
      - research/triggers/PHASE87_RUN.txt
      - research/tools/PHASE87_FORWARD_CAPTURE.py
      - research/tools/PHASE91_PROSPECTIVE_EVALUATOR.py

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas curl_cffi

      - name: Capture forward data
        run: python research/tools/PHASE87_FORWARD_CAPTURE.py

      - name: Run prospective frozen evaluator
        run: python research/tools/PHASE91_PROSPECTIVE_EVALUATOR.py

      - name: Commit all generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/data/forward research/reports/PHASE91_PROSPECTIVE_EVALUATION.md
          git commit -m "data: save Phase 87 forward capture and Phase 91 evaluation [skip ci]" || exit 0
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
