name: full-index-deep-research

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  research:
    if: startsWith(github.event.issue.title, '[RESEARCH] Run full index')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas numpy
      - run: python scripts/full_index_hm_research.py
      - uses: actions/upload-artifact@v4
        with:
          name: full-index-deep-research
          path: artifacts/full_index_research/
          retention-days: 30
