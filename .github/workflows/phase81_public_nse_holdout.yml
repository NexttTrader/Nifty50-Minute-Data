name: Phase 81 public NSE holdout acquisition

on:
  push:
    paths:
      - research/triggers/PHASE81_RUN.txt
      - research/tools/PHASE81_NSE_PUBLIC_HOLDOUT.py

permissions:
  contents: write

jobs:
  acquire:
    if: hashFiles('research/triggers/PHASE81_RUN.txt') != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas requests

      - name: Acquire public NSE holdout
        run: python research/tools/PHASE81_NSE_PUBLIC_HOLDOUT.py

      - name: Validate output
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          p = Path("research/data/external_holdout")
          combined = p / "NIFTY_FUT_5m_OCT2025_MAR2026_NSE_PUBLIC.csv"
          manifest = p / "NSE_CONTRACT_MANIFEST.csv"
          assert combined.exists(), combined
          assert manifest.exists(), manifest
          m = pd.read_csv(manifest)
          assert len(m) == 6, m
          assert (m["rows"] > 0).all(), m
          df = pd.read_csv(combined)
          assert df["trading_symbol"].nunique() == 6, df["trading_symbol"].value_counts()
          print(m.to_string(index=False))
          print(f"combined_rows={len(df)}")

          - name: Commit holdout
            run: |
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              rm -f research/triggers/PHASE81_RUN.txt
              git add research/data/external_holdout research/triggers/PHASE81_RUN.txt
              git commit -m "data: acquire Phase 81 public NSE futures holdout [skip ci]" || exit 0
              git push
